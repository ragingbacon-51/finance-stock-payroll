{% extends "base.html" %}

{% block title %}Record stock movement | Finance, Stock and Payroll{% endblock %}

{% block content %}
<h1>Record stock movement</h1>
<p>Stock issues cannot exceed the available balance. Movements are recorded permanently.</p>
<form method="post" class="mt-3">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Record movement</button>
    <a class="btn btn-outline-secondary" href="{% url 'inventory:list' %}">Cancel</a>
</form>
{% endblock %}
