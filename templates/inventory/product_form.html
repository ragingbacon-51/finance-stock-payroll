{% extends "base.html" %}

{% block title %}Add product | Finance, Stock and Payroll{% endblock %}

{% block content %}
<h1>Add product</h1>
<form method="post" class="mt-3">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Save product</button>
    <a class="btn btn-outline-secondary" href="{% url 'inventory:list' %}">Cancel</a>
</form>
{% endblock %}
